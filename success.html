{% extends "base.html" %}
{% block title %}Регистрация подтверждена{% endblock %}
{% block content %}

  <div class="success-icon">✓</div>
  <div class="eyebrow">ГОТОВО</div>
  <h1>Ваш выбор<br><em>зарегистрирован</em></h1>

  <a class="button" href="{{ url_for('index') }}">Вернуться на сайт</a>
</main>
{% endblock %}
